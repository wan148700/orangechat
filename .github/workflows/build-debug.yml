name: Build Debug APK

on:
  push:
    branches:
      - liquid-glass-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init log
        run: |
          {
            echo "===== CI START $(date) ====="
            echo "pwd: $(pwd)"
            echo "node: $(node -v 2>&1 || echo none)"
            echo "npm: $(npm -v 2>&1 || echo none)"
            echo "pnpm: $(pnpm -v 2>&1 || echo none)"
          } | tee ci-failure.log

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pnpm
        run: |
          set -o pipefail
          npm install -g pnpm@9 2>&1 | tee -a ci-failure.log
          echo "pnpm now: $(pnpm -v 2>&1)" | tee -a ci-failure.log

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee -a ../ci-failure.log

      - name: Generate debug keystore
        run: |
          set -o pipefail
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tee -a ci-failure.log

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a ci-failure.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-liquidglass-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release with APK
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="liquidglass-build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --title "Liquid Glass Debug ($TAG)" \
            --notes "Auto-built debug APK from liquid-glass-ui." \
            app/build/outputs/apk/debug/*.apk

      - name: Commit build log on failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -f ci-failure.log ]; then
            tail -c 200000 ci-failure.log > ci-failure.log.tmp
            mv ci-failure.log.tmp ci-failure.log
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add -f ci-failure.log
            git commit -m "ci: record build log [skip ci]" || true
            git push origin HEAD:liquid-glass-ui || true
          fi
